<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join UltraCash | Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-gray-900 rounded-3xl border border-white/5 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-green-500 italic">ULTRACASH</h1>
            <p class="text-gray-400 mt-2">Start earning in less than 60 seconds.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Email</label>
                <input type="email" id="email" class="w-full p-4 rounded-xl bg-black border border-white/10 focus:border-green-500 outline-none transition mt-1">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Password</label>
                <input type="password" id="password" class="w-full p-4 rounded-xl bg-black border border-white/10 focus:border-green-500 outline-none transition mt-1">
            </div>
            
            <button id="signup-btn" onclick="handleSignUp()" 
                class="w-full bg-green-500 text-black p-5 rounded-2xl font-black text-lg hover:bg-green-400 transition-all mt-4">
                CREATE ACCOUNT
            </button>
        </div>

        <p class="text-center text-sm text-gray-600 mt-6">
            Already a member? <a href="/login.html" class="text-green-500 font-bold hover:underline">Log In</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPh1FrUNe3W2XW7nFf3rLJVYiCk8Fb8eI",
            authDomain: "ultracash-3616a.firebaseapp.com",
            databaseURL: "https://ultracash-3616a-default-rtdb.firebaseio.com",
            projectId: "ultracash-3616a",
            storageBucket: "ultracash-3616a.firebasestorage.app",
            messagingSenderId: "847670858799",
            appId: "1:847670858799:web:2517b13afa5de2ad3262da"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.handleSignUp = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signup-btn');

            try {
                btn.innerText = "Creating...";
                btn.disabled = true;

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await set(ref(db, 'users/' + userCredential.user.uid), {
                    email: email,
                    points: 0
                });

                // Redirect to the dashboard/homepage after success
                window.location.href = "/"; 
            } catch (e) {
                alert(e.message);
                btn.innerText = "CREATE ACCOUNT";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
