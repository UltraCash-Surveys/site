<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join UltraCash | Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; opacity: 0; transition: opacity 0.3s ease; }
        body.loaded { opacity: 1; }
    </style>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-md p-10 bg-gray-900 rounded-[2.5rem] border border-white/5 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-green-500/10 blur-[80px] rounded-full"></div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-green-500 italic tracking-tighter">ULTRACASH</h1>
            <p class="text-gray-400 mt-2 font-medium">Start earning in less than 60 seconds.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" 
                    class="w-full p-4 rounded-2xl bg-black border border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 outline-none transition mt-1.5 text-sm">
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Secure Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                    class="w-full p-4 rounded-2xl bg-black border border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 outline-none transition mt-1.5 text-sm">
            </div>
            
            <button id="signup-btn" onclick="handleSignUp()" 
                class="w-full bg-green-500 text-black p-5 rounded-[1.5rem] font-black text-lg hover:bg-green-400 hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">
                CREATE ACCOUNT
            </button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            Already a member? <a href="/login" class="text-green-500 font-bold hover:underline">Log In</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPh1FrUNe3W2XW7nFf3rLJVYiCk8Fb8eI",
            authDomain: "ultracash-3616a.firebaseapp.com",
            databaseURL: "https://ultracash-3616a-default-rtdb.firebaseio.com",
            projectId: "ultracash-3616a",
            storageBucket: "ultracash-3616a.firebasestorage.app",
            messagingSenderId: "847670858799",
            appId: "1:847670858799:web:2517b13afa5de2ad3262da"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 1. REDIRECT IF ALREADY LOGGED IN
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "/dashboard";
            } else {
                document.body.classList.add('loaded');
            }
        });

        // 2. SIGNUP LOGIC
        window.handleSignUp = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signup-btn');

            if (!email || password.length < 6) {
                alert("Please provide a valid email and a password (min 6 chars).");
                return;
            }

            try {
                btn.innerText = "Verifying...";
                btn.disabled = true;

                // Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // Create Initial DB Entry
                // Note: Security rules allow this ONLY if the record doesn't exist yet.
                await set(ref(db, 'users/' + userCredential.user.uid), {
                    email: email,
                    points: 0,
                    joinedAt: new Date().toISOString()
                });

                window.location.href = "/dashboard"; 
            } catch (e) {
                console.error(e);
                alert(e.message);
                btn.innerText = "CREATE ACCOUNT";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
