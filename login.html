<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UltraCash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-md bg-white/[0.03] border border-white/10 p-10 rounded-[2.5rem] shadow-2xl backdrop-blur-md">
        <div class="text-center mb-10">
            <div class="text-3xl font-black italic tracking-tighter text-green-500 mb-2">ULTRACASH</div>
            <h2 class="text-xl font-bold">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-1">Continue earning where you left off.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Email Address</label>
                <input type="email" id="login-email" class="w-full bg-black border border-white/10 p-4 rounded-2xl focus:border-green-500 outline-none transition mt-2 text-white">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Password</label>
                <input type="password" id="login-password" class="w-full bg-black border border-white/10 p-4 rounded-2xl focus:border-green-500 outline-none transition mt-2 text-white">
            </div>
            
            <button id="login-btn" onclick="handleLogin()" 
                class="w-full bg-green-500 text-black p-5 rounded-2xl font-black text-lg hover:bg-green-400 transition-all shadow-[0_10px_30px_rgba(34,197,94,0.15)] mt-4">
                LOG IN
            </button>
        </div>

        <div class="mt-8 pt-8 border-t border-white/5 text-center">
            <p class="text-sm text-gray-500">
                New to the platform? <a href="/signup" class="text-green-500 font-bold hover:underline">Create Account</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Config (Keep this consistent across all pages)
        const firebaseConfig = {
            apiKey: "AIzaSyDPh1FrUNe3W2XW7nFf3rLJVYiCk8Fb8eI",
            authDomain: "ultracash-3616a.firebaseapp.com",
            databaseURL: "https://ultracash-3616a-default-rtdb.firebaseio.com",
            projectId: "ultracash-3616a",
            storageBucket: "ultracash-3616a.firebasestorage.app",
            messagingSenderId: "847670858799",
            appId: "1:847670858799:web:2517b13afa5de2ad3262da"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) return alert("Please fill in your details.");

            try {
                btn.innerText = "Verifying...";
                btn.disabled = true;

                // Log the user in
                await signInWithEmailAndPassword(auth, email, password);

                // Success! Send them to the dashboard
                window.location.href = "/dashboard"; 
            } catch (e) {
                alert("Login Failed: " + e.message);
                btn.innerText = "LOG IN";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
